services:
  payload_blue:
    image: blockvibe-app:latest
    container_name: payload_blue
    restart: always
    ports:
      - "127.0.0.1:3000:3000" # Bind to port 3000 for Blue instance
    volumes:
      - /var/www/blockvibe/media:/app/apps/payload-web/public/media
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-localhost}@db:5432/${DB_NAME:-blockvibe-multitenant}

  payload_green:
    image: blockvibe-app:latest
    container_name: payload_green
    restart: always
    ports:
      - "127.0.0.1:3001:3000" # Bind to port 3001 for Green instance
    volumes:
      - /var/www/blockvibe/media:/app/apps/payload-web/public/media
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-localhost}@db:5432/${DB_NAME:-blockvibe-multitenant}

  db:
    image: postgres:16-alpine
    container_name: blockvibe_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-localhost}
      - POSTGRES_DB=${DB_NAME:-blockvibe-multitenant}
    ports:
      - "127.0.0.1:5432:5432" # Bind only to localhost for security
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
